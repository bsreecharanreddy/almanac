name: CI

on:
  push:
    branches: [main]
    # A docs-only push cannot change what the suite checks: `docs/` holds
    # only .md and .png, nothing under it is read at runtime (the
    # `docs/findings/...` strings in `src/` are prose citations inside
    # comments), and ruff/mypy/pytest never walk it. This does NOT weaken
    # the full-suite gate, which was the first objection to it -- GitHub
    # skips a run only when *every* path in the push diff matches: "When
    # all the path names match patterns in `paths-ignore`, the workflow
    # will not run" (Actions workflow-syntax reference, checked
    # 2026-09-06). A commit touching both docs and code still runs.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'

  # Deliberately unfiltered. A pull request is the merge gate, and a
  # skipped run reports no status at all -- so if a required status check
  # is ever enabled, a filtered docs-only PR would wait forever on a check
  # that will never report. Branch protection is unavailable today (the
  # API returns 403 for a private repo on the free plan) but becomes
  # available the moment this repo goes public. Filtering `push` alone
  # fixes the burst this was written for -- all six redundant runs on
  # 2026-09-06 were pushes to `main` -- without arming that trap.
  pull_request:

# One run per ref at a time; a newer push cancels the older run rather than
# racing it. The full suite is ~45 min on a 2-core runner, so a burst of
# commits otherwise leaves several redundant runs grinding in parallel --
# six at once on 2026-09-06, all superseded by the newest, which is the
# only one whose result meant anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The two are pinned differently on purpose, and the difference is
      # not cosmetic: `releases/latest` returns a RELEASE tag, which is not
      # necessarily a resolvable action ref. actions/checkout publishes a
      # floating major tag (refs/tags/v7 exists); astral-sh/setup-uv does
      # not (no refs/tags/v10 -- only v10.0.1), so it must be pinned exact.
      # Verified with `gh api repos/<owner>/<repo>/git/ref/tags/<ref>`,
      # after `@v10` failed CI with "unable to resolve action".
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # A hosted runner has ~20 GB free after its preinstalled image, and this
      # suite outgrew it: run 34263618259 died with "No space left on device"
      # (2026-09-08) -- `coverage` lost the runner outright at 1h14m, `check`
      # reached the cache-save post-step at 1h26m and failed there, after every
      # real step had passed. The load is a ~2 GB venv (torch 553M, pyspark
      # 475M, pyarrow 122M), a multi-GB uv cache restored *and re-saved*, Spark
      # scratch, MLflow artifacts, and pytest's tmp roots (~305 MB/run, last 3
      # retained). Dropping toolchains this repo never uses buys back ~25 GB.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - run: uv python install 3.12
      - run: uv sync --all-extras --dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

      # -m "not network" keeps CI off data.gharchive.org: a third-party
      # host outage must never turn this build red.
      - run: uv run pytest -m "not network" -v

      # Gold, on a cold machine. `almanac.spark.dbt_session`'s persistent
      # metastore is a correctness requirement, and a laptop with a warm
      # metastore directory is structurally blind to a regression in it --
      # the mirror image of Phase 1 Task 2's finding that a UTC CI runner is
      # blind to timezone defects. This is the only place it runs cold.
      #
      # `dim_repo` (Task 3) selects from a real source, so Gold needs real
      # Silver data first -- the committed fixtures, landed through Bronze
      # and Silver exactly as `tests/integration/test_pipeline.py` does.
      - run: uv run python scripts/build_silver_fixture.py
      - run: uv run python -m almanac.gold.runner --silver-path data/gold_fixture/silver build

  # §10's ">=70% coverage on transformation and feature logic", enforced as a
  # build failure rather than a number in a document. Its own job, not a flag
  # on the step above, for two measured reasons: coverage costs ~2.4x on this
  # suite (46:19 against a 19:32 baseline, 2026-09-07), and a separate job
  # runs *alongside* `check` rather than after it, so the wall-clock time to a
  # red/green signal is unchanged.
  #
  # pull_request only, and that is a cost decision rather than a rigour one:
  # this repo is private on the free plan, where Actions minutes are finite,
  # and its branch model is one PR per phase -- so this runs a handful of
  # times instead of on every push. Drop the `if` when the repo goes public.
  #
  # The scope and the threshold both live in pyproject.toml's [tool.coverage.*],
  # so this job and `make coverage` cannot disagree about what is measured or
  # about what passes.
  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # A hosted runner has ~20 GB free after its preinstalled image, and this
      # suite outgrew it: run 34263618259 died with "No space left on device"
      # (2026-09-08) -- `coverage` lost the runner outright at 1h14m, `check`
      # reached the cache-save post-step at 1h26m and failed there, after every
      # real step had passed. The load is a ~2 GB venv (torch 553M, pyspark
      # 475M, pyarrow 122M), a multi-GB uv cache restored *and re-saved*, Spark
      # scratch, MLflow artifacts, and pytest's tmp roots (~305 MB/run, last 3
      # retained). Dropping toolchains this repo never uses buys back ~25 GB.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - run: uv python install 3.12
      - run: uv sync --all-extras --dev

      # Serial, like the `check` job: a 2-core runner gains nothing from
      # xdist, and the parallel run is what made the streaming tests' hang
      # guard fire on budget alone.
      - run: uv run pytest -m "not network" --cov --cov-report=term
