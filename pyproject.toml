[project]
name = "almanac"
version = "0.1.0"
description = "An ML platform for work-queue risk, built on the GitHub event firehose"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Version floors checked live on 2026-09-01, not carried over from a plan.
#
# The upper bound on pyspark is load-bearing: delta-spark 4.4.0 declares
# `pyspark<=4.2.0,>=4.0.1`, and 4.2.0 is the current release -- i.e. the
# ceiling is exactly where we sit. Left unbounded, the day PySpark 4.3
# ships this resolves to an incompatible pair and fails at SparkSession
# construction rather than at install time. Revisit when delta-spark
# raises its own ceiling.
spark = [
    "pyspark>=4.2.0,<4.3",
    "delta-spark>=4.4.0",
]

# Gold only (design doc §8): dbt never touches Bronze or Silver.
#
# `dbt-spark[session]` runs dbt in-process against the SparkSession this
# repo already builds, rather than over a Thrift/ODBC connection to a
# server that does not exist locally. Versions checked live on 2026-09-01;
# dbt-spark declares `pyspark<5.0.0,>=3.0.0`, so it composes with the
# ceiling above rather than fighting it.
dbt = [
    "dbt-core>=1.12.3,<1.13",
    "dbt-spark[session]>=1.11.0,<1.12",
]

# Phase 4 (design doc §5.2): the model, tracking, and registry stack.
# Version floors checked live on 2026-09-03, not carried over from a plan.
#
# The `<3` ceiling on pandas is load-bearing, same as the pyspark ceiling
# above: mlflow 3.15.2 (and every 3.x) declares `pandas<3`, while
# pyspark[sql] 4.2 needs `pandas>=2.2.0` -- so the usable band is 2.x, and
# the plan's original `pandas>=3.0.5` floor (latest release, but unchecked
# against mlflow) is unsatisfiable. 2.3.3 is the current 2.x. Revisit when
# mlflow raises its own ceiling.
ml = [
    "mlflow>=3.15.2",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
    "pandas>=2.3.3,<3",
    # Phase 5 (design doc §8.3a): the embedding pipeline. 6.0.1 is current
    # on PyPI as of 2026-09-04, checked directly against pypi.org's JSON
    # API rather than a search summary -- a prior live-search result for
    # this same package claimed 5.6.1 and was stale.
    "sentence-transformers>=6.0.1",
    # Phase 5 Task 3 (design doc §8.3a): the query-time Vector Search client.
    # databricks-ai-search, not the deprecated databricks-vectorsearch shim
    # -- Gate 2's finding (2026-09-04) applied at the dependency itself, not
    # just recorded. 0.78 confirmed directly against pypi.org's JSON API.
    "databricks-ai-search>=0.78",
    # Phase 6 Task 7 (design doc §4.6): the Lakebase online-store client.
    # The plan carried `>=0.13.0` from Microsoft Learn's install snippet;
    # pypi.org's JSON API says the current release is **0.17.1**, and the
    # repo's convention is to floor at the current release, not at a doc's
    # stated minimum. Introspected directly rather than trusted: 0.17.1's
    # `FeatureEngineeringClient` really does carry `create_online_store`,
    # `publish_table`, `get_online_store` and `delete_online_store`, all
    # keyword-only.
    "databricks-feature-engineering>=0.17.1",
    # Phase 7 Task 2/3 (design doc §4.7): reading `system.access.column_lineage`
    # to generate the lineage artifact. Already present transitively via the two
    # clients above, but a transitive pin is not a declaration -- the artifact's
    # regeneration would break silently if either dropped it. 0.136.0 is the
    # current release, checked against pypi.org's JSON API.
    "databricks-sdk>=0.136.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "chispa>=0.12.0",
    "mypy>=2.3.1",
    # pandas ships no py.typed; mypy --strict needs the stubs. Kept in step
    # with the pandas 2.3.x pinned in the `ml` extra above -- pandas-stubs
    # is versioned to track a specific pandas release.
    "pandas-stubs>=2.3.3.260113,<2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # `make test` runs `-n 4`: each xdist worker gets its own session-scoped
    # SparkSession, so the ~170 Spark tests run four at a time. CI keeps the
    # serial `pytest` invocation (2-core runner, no gain).
    "pytest-xdist>=3.6.1",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF", "C90"]
# N812 fires on `from pyspark.sql import functions as F`, which is the
# universal PySpark idiom -- every example in Spark's own docs uses it, and
# every module in the pipeline will. Renaming it to satisfy the rule would
# make this codebase read as unfamiliar to a Spark engineer, which is the
# opposite of what the rule is for.
ignore = ["N812"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Comparing against expected literals is normal and readable in tests.
# PLR0913: a test builder that spells out every field of the row it lands
# is clearer than one taking a config object -- the explicit keywords are
# what make the call site readable at a glance.
"tests/**/*.py" = ["PLR2004", "PLR0913"]
# write_and_register takes the session, the spec and the frame it cannot
# derive, plus one keyword per independently-set output knob (path, whether
# to register, target schema) -- shared verbatim by the batch and streaming
# feature paths (Phase 6).
"src/almanac/features/runner.py" = ["PLR0913"]
# Same PLR0913 reasoning, one layer in: build_training_frame and the model
# runner take one keyword-only argument per independently-pinnable Delta
# source (three paths, three versions, the session), and the explicit
# keywords are what make a version-pinned call readable (Phase 4, §5.2).
"src/almanac/model/*.py" = ["PLR0913"]
# Same reasoning again: run_embedding_pipeline's I/O boundary takes one
# keyword-only argument per independently-named path/knob (Phase 5, §8.3a).
"src/almanac/embed/*.py" = ["PLR0913"]
# run_similarity is the same I/O-boundary shape once more, plus the real
# ANN index and the sample-size bound the real run needs (Phase 5, §8.3a).
"src/almanac/features/similarity_runner.py" = ["PLR0913"]
# replay_hours takes one keyword-only argument per independently-tunable
# forcing knob (source, lateness, duplicate_rate, shuffle, seed) -- the
# explicit keywords are what make a call like
# `replay_hours(spark, hours, dest, lateness=...)` readable at the call
# site (Phase 6, Task 4).
"src/almanac/stream/replay.py" = ["PLR0913"]
# publish_feature_table takes the two collaborators it cannot construct
# (the client, the session) plus one keyword per thing the service names
# independently -- store, source table, online table, publish mode. Naming
# them at the call site is what makes a publish readable (Phase 6, Task 7).
"src/almanac/stream/online_store.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

# scikit-learn ships no py.typed (still true at 1.9) and has no maintained
# stub package. Used only for train_test_split and mean_absolute_error in
# almanac.model.train -- both take/return arrays and DataFrames mypy still
# checks at the call site.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# databricks-ai-search 0.78 ships no py.typed either (Phase 5 Task 5, design
# doc §8.3a). Used only for AISearchClient construction and one
# similarity_search call in embed/query.py -- the untyped boundary is
# exactly VectorSearchIndex.query, which is deliberately not unit-tested
# beyond import (the real query path is verified only against the real
# endpoint, Task 7).
[[tool.mypy.overrides]]
module = ["databricks.ai_search.*"]
ignore_missing_imports = true

# databricks-feature-engineering 0.17.1 ships no py.typed either, and neither
# does the databricks.ml_features package its entities live in (Phase 6 Task 7,
# design doc §4.6). Used only for the one `FeatureEngineeringClient()`
# construction in stream/online_store.py's `load_client`; every method this
# project calls on it is restated as a typed `OnlineStoreClient` Protocol
# there, so the untyped surface is that single constructor. databricks-sdk
# itself *does* ship py.typed, so `NotFound` stays checked.
[[tool.mypy.overrides]]
module = ["databricks.feature_engineering.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spark: needs a SparkSession (slow)",
  "network: hits data.gharchive.org (slow, excluded from CI)",
  "integration: runs several pipeline stages together (slow)",
]
